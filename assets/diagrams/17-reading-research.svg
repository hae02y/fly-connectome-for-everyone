<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#4dd8c2"/></marker></defs><rect width="1200" height="440" fill="#0b1e2e"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="60" y="80" fill="white" font-size="34">이미지를 인용하는 순서</text><rect x="69" y="160" width="240" height="150" rx="18" fill="#16334b" stroke="#4dd8c2"/><text x="189" y="218" text-anchor="middle" fill="white" font-size="26">원본 찾기</text><text x="189" y="267" text-anchor="middle" fill="#b9d8e7" font-size="19">제작자와 데이터</text><path d="M 311 235 h 28" stroke="#4dd8c2" stroke-width="3" marker-end="url(#a)"/><rect x="343" y="160" width="240" height="150" rx="18" fill="#16334b" stroke="#4dd8c2"/><text x="463" y="218" text-anchor="middle" fill="white" font-size="26">조건 확인</text><text x="463" y="267" text-anchor="middle" fill="#b9d8e7" font-size="19">재사용 라이선스</text><path d="M 585 235 h 28" stroke="#4dd8c2" stroke-width="3" marker-end="url(#a)"/><rect x="617" y="160" width="240" height="150" rx="18" fill="#16334b" stroke="#4dd8c2"/><text x="737" y="218" text-anchor="middle" fill="white" font-size="26">본문 배치</text><text x="737" y="267" text-anchor="middle" fill="#b9d8e7" font-size="19">설명과 함께 사용</text><path d="M 859 235 h 28" stroke="#4dd8c2" stroke-width="3" marker-end="url(#a)"/><rect x="891" y="160" width="240" height="150" rx="18" fill="#16334b" stroke="#4dd8c2"/><text x="1011" y="218" text-anchor="middle" fill="white" font-size="26">캡션 기록</text><text x="1011" y="267" text-anchor="middle" fill="#b9d8e7" font-size="19">출처·변경 여부</text><text x="600" y="380" text-anchor="middle" fill="#bad4e0" font-size="22">그림의 실제 데이터 여부를 독자에게 명시</text><text x="1140" y="420" text-anchor="end" fill="#7394a5" font-size="14">저자 제작 설명 도식</text></g></svg>
