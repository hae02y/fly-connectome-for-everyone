<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#4dd8c2"/></marker></defs><rect width="1200" height="440" fill="#0b1e2e"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="60" y="80" fill="white" font-size="34">뇌에서 배우는 세 수준</text><rect x="206" y="160" width="240" height="150" rx="18" fill="#16334b" stroke="#4dd8c2"/><text x="326" y="218" text-anchor="middle" fill="white" font-size="26">구조</text><text x="326" y="267" text-anchor="middle" fill="#b9d8e7" font-size="19">어떻게 연결하나</text><path d="M 448 235 h 28" stroke="#4dd8c2" stroke-width="3" marker-end="url(#a)"/><rect x="480" y="160" width="240" height="150" rx="18" fill="#16334b" stroke="#4dd8c2"/><text x="600" y="218" text-anchor="middle" fill="white" font-size="26">알고리즘</text><text x="600" y="267" text-anchor="middle" fill="#b9d8e7" font-size="19">어떻게 계산하나</text><path d="M 722 235 h 28" stroke="#4dd8c2" stroke-width="3" marker-end="url(#a)"/><rect x="754" y="160" width="240" height="150" rx="18" fill="#16334b" stroke="#4dd8c2"/><text x="874" y="218" text-anchor="middle" fill="white" font-size="26">하드웨어</text><text x="874" y="267" text-anchor="middle" fill="#b9d8e7" font-size="19">어디서 실행하나</text><text x="600" y="380" text-anchor="middle" fill="#bad4e0" font-size="22">각 수준의 효과를 같은 과제와 자원 조건에서 비교</text><text x="1140" y="420" text-anchor="end" fill="#7394a5" font-size="14">저자 제작 설명 도식</text></g></svg>
